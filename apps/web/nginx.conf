server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # React gère les routes, on renvoie toujours index.html
  location / {
    try_files $uri /index.html;
  }

  # On renvoie /api vers le conteneur de l'API
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
}
